
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Vision 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #111d30;
  border-bottom: 1px solid #263b55;
}

header h2 {
  margin: 0;
  color: #42d9f5;
  font-size: 21px;
}

header p {
  color: #91a5c4;
  font-size: 12px;
}

main { padding: 15px; }

h3 { margin: 12px 0; }

#viewer {
  width: 100%;
  height: 55vh;
  min-height: 330px;
  background: #0c1524;
  border: 1px solid #263b55;
  border-radius: 16px;
  overflow: hidden;
}

.controls {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 15px;
}

button {
  flex: 1;
  min-width: 90px;
  padding: 13px 8px;
  border: 1px solid #31516e;
  border-radius: 10px;
  background: #172a40;
  color: white;
  font-weight: bold;
}

button.active {
  background: #087e9b;
  border-color: #42d9f5;
}

#status {
  text-align: center;
  color: #42d9f5;
  font-size: 13px;
}

.note {
  color: #8fa4bf;
  font-size: 12px;
  text-align: center;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<header>
  <h2>ANATOMY VISION 3D</h2>
  <p>YOUR PERSONAL ANATOMY EXPLORER</p>
</header>

<main>
  <h3>Human Anatomy Explorer</h3>

  <div id="viewer"></div>

  <div class="controls">
    <button id="muscles" class="active">Muscles</button>
    <button id="bones">Skeleton</button>
    <button id="reset">Reset View</button>
  </div>

  <p id="status">Muscular model selected</p>
  <p class="note">Drag to rotate • Pinch to zoom</p>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";

const viewer = document.getElementById("viewer");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0c1524");

const camera = new THREE.PerspectiveCamera(
  45, viewer.clientWidth / viewer.clientHeight, 0.1, 100
);

camera.position.set(5, 2.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.7, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(4, 7, 5);
scene.add(light);

const muscleGroup = new THREE.Group();
const boneGroup = new THREE.Group();

scene.add(muscleGroup, boneGroup);

function ball(group, x, y, z, sx, sy, sz, color) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 24, 24),
    new THREE.MeshStandardMaterial({ color, roughness: 0.65 })
  );
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  group.add(mesh);
}

function rod(group, a, b, radius, color) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, direction.length(), 16),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );

  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0), direction.normalize()
  );

  group.add(mesh);
}

// Head and neck
ball(muscleGroup, 0, 3.45, 0, .29, .36, .27, "#bd625d");
ball(boneGroup, 0, 3.45, 0, .25, .32, .23, "#e8dfc9");

// Torso and pelvis
ball(muscleGroup, 0, 2.42, 0, .57, .67, .31, "#a94148");
ball(boneGroup, 0, 2.42, 0, .43, .61, .23, "#e8dfc9");

ball(muscleGroup, 0, 1.55, 0, .43, .32, .3, "#a94148");
ball(boneGroup, 0, 1.55, 0, .38, .27, .25, "#e8dfc9");

// Spine
for (let i = 0; i < 13; i++) {
  ball(boneGroup, 0, 2.95 - i * .105, -.03,
       .09, .055, .08, "#f0e5cb");
}

// Arms and legs
for (const side of [-1, 1]) {

  // Shoulder
  ball(muscleGroup, side*.57, 2.82, 0,
       .25, .25, .24, "#b94849");

  // Upper arm
  rod(muscleGroup, [side*.58,2.75,0],
      [side*.77,2.12,0], .15, "#b74849");

  rod(boneGroup, [side*.58,2.75,0],
      [side*.77,2.12,0], .07, "#e8dfc9");

  // Forearm
  rod(muscleGroup, [side*.77,2.12,0],
      [side*.87,1.53,0], .105, "#b74849");

  rod(boneGroup, [side*.77,2.12,0],
      [side*.87,1.53,0], .045, "#e8dfc9");

  // Hand
  ball(muscleGroup, side*.87, 1.42, 0,
       .11, .17, .08, "#bd625d");

  // Thigh
  rod(muscleGroup, [side*.28,1.45,0],
      [side*.36,.76,0], .19, "#a94148");

  rod(boneGroup, [side*.28,1.45,0],
      [side*.36,.76,0], .08, "#e8dfc9");

  // Knee
  ball(muscleGroup, side*.36, .7, 0,
       .13, .14, .13, "#b94849");

  // Lower leg
  rod(muscleGroup, [side*.36,.68,0],
      [side*.38,.12,0], .12, "#a94148");

  rod(boneGroup, [side*.36,.68,0],
      [side*.38,.12,0], .055, "#e8dfc9");

  // Foot
  ball(muscleGroup, side*.38, .05, .12,
       .13, .08, .23, "#bd625d");
}

function showMuscles() {
  muscleGroup.visible = true;
  boneGroup.visible = false;
  document.getElementById("muscles").classList.add("active");
  document.getElementById("bones").classList.remove("active");
  document.getElementById("status").textContent =
    "Muscular model selected";
}

function showBones() {
  muscleGroup.visible = false;
  boneGroup.visible = true;
  document.getElementById("bones").classList.add("active");
  document.getElementById("muscles").classList.remove("active");
  document.getElementById("status").textContent =
    "Skeletal model selected";
}

document.getElementById("muscles").onclick = showMuscles;
document.getElementById("bones").onclick = showBones;

document.getElementById("reset").onclick = () => {
  camera.position.set(5, 2.5, 8);
  controls.target.set(0, 1.7, 0);
  controls.update();
};

showMuscles();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = viewer.clientWidth / viewer.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
});
</script>

</body>
  </html>
