
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Vision - Shoulder Lab</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080e19;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #14243a;
  border-bottom: 1px solid #29435e;
}

h2 { color: #48dafa; margin: 0; }
header p { color: #9aacc4; font-size: 12px; }

main { padding: 15px; }

#viewer {
  height: 52vh;
  min-height: 320px;
  border: 1px solid #29435e;
  border-radius: 14px;
  overflow: hidden;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0;
}

button {
  flex: 1;
  min-width: 90px;
  padding: 12px 7px;
  color: white;
  background: #192d45;
  border: 1px solid #355472;
  border-radius: 9px;
}

button.active { background: #087f9d; }

#info {
  padding: 15px;
  background: #14243a;
  border-radius: 12px;
  color: #c2d5eb;
  line-height: 1.5;
}

#info h3 { color: #48dafa; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<header>
  <h2>SHOULDER JOINT LAB</h2>
  <p>ANATOMY VISION 3D</p>
</header>

<main>
  <h3>Explore Shoulder Joint</h3>

  <div id="viewer"></div>

  <div class="controls">
    <button id="all" class="active">All Bones</button>
    <button id="scapula">Scapula</button>
    <button id="humerus">Humerus</button>
    <button id="clavicle">Clavicle</button>
    <button id="reset">Reset</button>
  </div>
  <div id="visual-panel" style="margin-top:14px;padding:14px;border-radius:14px;background:rgba(15,30,54,0.85);border:1px solid rgba(56,189,248,0.28);">
    <div style="font-size:12px;letter-spacing:1.2px;color:#38bdf8;font-weight:700;margin-bottom:10px;text-transform:uppercase;">
      Visual Thinking Lab
    </div>
    <div class="controls" style="margin-top:0;margin-bottom:12px;">
      <button id="xray-toggle" type="button">X-Ray Ghost: OFF</button>
      <button id="joint-zoom" type="button">Zoom Joint</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button id="mov-abduction" class="mov-btn active" type="button" style="flex:1;padding:8px 4px;font-size:12px;">Abduction</button>
      <button id="mov-flexion" class="mov-btn" type="button" style="flex:1;padding:8px 4px;font-size:12px;">Flexion</button>
      <button id="mov-rotation" class="mov-btn" type="button" style="flex:1;padding:8px 4px;font-size:12px;">Rotation</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cbd5e1;margin-bottom:6px;">
      <span id="mov-label">Shoulder Abduction</span>
      <span id="mov-deg" style="color:#38bdf8;font-weight:700;">0°</span>
    </div>
    <input id="mov-slider" type="range" min="0" max="180" value="0" style="width:100%;accent-color:#38bdf8;cursor:pointer;">
    <div id="mov-note" style="font-size:12px;color:#94a3b8;margin-top:6px;">
      Move slider to simulate 3D joint motion & Scapulohumeral Rhythm.
    </div>
  </div>
  
  <div id="info">
    <h3>Shoulder Joint</h3>
    Select a bone to explore its basic anatomy.
  </div>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";

const viewer = document.getElementById("viewer");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0c1728");

const camera = new THREE.PerspectiveCamera(
  45, viewer.clientWidth / viewer.clientHeight, 0.1, 100
);

camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(4,5,6);
scene.add(light);

const bones = {};

function material(color) {
 return new THREE.MeshStandardMaterial({
  color: color,
  roughness: 0.65
 });
}

function sphere(parent,x,y,z,sx,sy,sz,color) {
 const obj = new THREE.Mesh(
  new THREE.SphereGeometry(1,32,24),
  material(color)
 );
 obj.position.set(x,y,z);
 obj.scale.set(sx,sy,sz);
 parent.add(obj);
 return obj;
}

function rod(parent,a,b,r,color) {
 const start = new THREE.Vector3(...a);
 const end = new THREE.Vector3(...b);
 const direction = new THREE.Vector3().subVectors(end,start);

 const obj = new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,direction.length(),24),
  material(color)
 );

 obj.position.copy(start).add(end).multiplyScalar(.5);
 obj.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),
  direction.normalize()
 );
 parent.add(obj);
 return obj;
}

  // Anatomically Accurate S-Shaped Clavicle
  bones.clavicle = new THREE.Group();
  scene.add(bones.clavicle);

  const clavMat = new THREE.MeshStandardMaterial({
    color: "#ebe0c7",
    roughness: 0.52,
    metalness: 0.05
  });

  // S-shaped curve: Medial 2/3 convex anteriorly (+Z), Lateral 1/3 concave anteriorly (-Z)
  const clavCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-1.42, 1.42, 0.24), // Medial (Sternal) end
    new THREE.Vector3(-0.98, 1.45, 0.36), // Medial 2/3 anterior convexity
    new THREE.Vector3(-0.48, 1.47, 0.26), // Junction of medial 2/3 & lateral 1/3
    new THREE.Vector3(-0.12, 1.47, 0.08), // Lateral 1/3 anterior concavity
    new THREE.Vector3(0.15, 1.47, 0.16)   // Lateral (Acromial) end meeting acromion
  ]);

  const clavGeo = new THREE.TubeGeometry(clavCurve, 36, 0.068, 16, false);
  const cPos = clavGeo.attributes.position;
  for (let i = 0; i < cPos.count; i++) {
    const vx = cPos.getX(i);
    const vy = cPos.getY(i);
    const vz = cPos.getZ(i);
    // Normalize t from 0 (medial) to 1 (lateral)
    const t = Math.max(0, Math.min(1, (vx + 1.42) / 1.57));
    // Enlarge medial sternal end (t near 0) & flatten lateral 1/3 vertically (t > 0.6)
    const medialFlare = Math.pow(Math.max(0, 1 - t * 4), 2) * 0.55;
    const lateralFlattenY = t > 0.55 ? 1 - ((t - 0.55) / 0.45) * 0.42 : 1;
    const lateralWidenZ = t > 0.55 ? 1 + ((t - 0.55) / 0.45) * 0.35 : 1;

    const center = clavCurve.getPointAt(t);
    cPos.setY(i, center.y + (vy - center.y) * (lateralFlattenY + medialFlare));
    cPos.setZ(i, center.z + (vz - center.z) * (lateralWidenZ + medialFlare));
  }
  clavGeo.computeVertexNormals();

  const clavShaft = new THREE.Mesh(clavGeo, clavMat);
  bones.clavicle.add(clavShaft);

    // Sternal Articular End (enlarged quadrangular facet)
  const sternalEnd = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 18, 16),
    clavMat
  );
  sternalEnd.position.set(-1.43, 1.42, 0.24);
  sternalEnd.scale.set(0.75, 1.15, 1.1);
  bones.clavicle.add(sternalEnd);

  // Conoid Tubercle (inferior surface near lateral 1/3, above coracoid)
  const conoidTubercle = new THREE.Mesh(
    new THREE.SphereGeometry(0.036, 12, 12),
    clavMat
  );
  conoidTubercle.position.set(-0.08, 1.41, 0.08);
  bones.clavicle.add(conoidTubercle);
  
  

  // Anatomically Accurate 3D Scapula
  bones.scapula = new THREE.Group();
  scene.add(bones.scapula);

  const scapMat = new THREE.MeshStandardMaterial({
    color: "#e8dac0",
    roughness: 0.55,
    metalness: 0.05,
    side: THREE.DoubleSide
  });
  const fossaMat = new THREE.MeshStandardMaterial({
    color: "#d4c2a3",
    roughness: 0.65,
    side: THREE.DoubleSide
  });

  // 1. Triangular Scapular Blade (Borders, Angles & Fossae)
  const bladeShape = new THREE.Shape();
  bladeShape.moveTo(-1.15, 1.32); // Superior Angle
  bladeShape.quadraticCurveTo(-0.62, 1.26, -0.15, 1.24); // Superior Border + Suprascapular notch
  bladeShape.lineTo(0.08, 1.05);  // Lateral Angle (Glenoid neck)
  bladeShape.quadraticCurveTo(-0.35, 0.30, -0.92, -0.48); // Thick Lateral (Axillary) Border
  bladeShape.quadraticCurveTo(-0.98, -0.54, -1.04, -0.46); // Inferior Angle
  bladeShape.quadraticCurveTo(-1.18, 0.45, -1.15, 1.32); // Medial (Vertebral) Border

  const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
    depth: 0.07,
    bevelEnabled: true,
    bevelThickness: 0.025,
    bevelSize: 0.025,
    bevelSegments: 4,
    curveSegments: 24
  });

  // Sculpt realistic anterior concavity (Subscapular fossa) & posterior convexity
  const bPos = bladeGeo.attributes.position;
  for (let i = 0; i < bPos.count; i++) {
    const vx = bPos.getX(i);
    const vy = bPos.getY(i);
    const vz = bPos.getZ(i);
    const arch = Math.sin(((vx + 1.18) / 1.26) * Math.PI) * 0.11;
    const vertCurve = Math.sin(((vy + 0.54) / 1.86) * Math.PI) * 0.06;
    bPos.setZ(i, vz - arch - vertCurve);
  }
  bladeGeo.computeVertexNormals();

  const scapBlade = new THREE.Mesh(bladeGeo, scapMat);
  scapBlade.position.set(0, 0, -0.24);
  bones.scapula.add(scapBlade);

  // 2. Spine of Scapula (dividing Supraspinous & Infraspinous Fossae)
  const spineCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-1.14, 0.92, -0.22), // Root of spine at medial border
    new THREE.Vector3(-0.75, 1.02, -0.34), // Mid-spine crest
    new THREE.Vector3(-0.32, 1.14, -0.42), // Lateral spine rising
    new THREE.Vector3(-0.04, 1.26, -0.36)  // Acromial angle
  ]);
  const spineGeo = new THREE.TubeGeometry(spineCurve, 28, 0.055, 12, false);
  const sPos = spineGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    sPos.setY(i, sPos.getY(i) * 1.02);
  }
  spineGeo.computeVertexNormals();
  const scapSpine = new THREE.Mesh(spineGeo, scapMat);
  bones.scapula.add(scapSpine);

  // 3. Acromion Process (arching forward over glenoid toward clavicle)
  const acromionCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.04, 1.26, -0.36),
    new THREE.Vector3(0.14, 1.38, -0.20),
    new THREE.Vector3(0.24, 1.44, 0.02),
    new THREE.Vector3(0.16, 1.46, 0.16) // Clavicular facet of acromion
  ]);
  const acromionGeo = new THREE.TubeGeometry(acromionCurve, 24, 0.075, 12, false);
  acromionGeo.scale(1, 0.96, 1);
  const acromionMesh = new THREE.Mesh(acromionGeo, scapMat);
  bones.scapula.add(acromionMesh);

  // 4. Coracoid Process (hook-like anterior-lateral projection)
  const coracoidCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.14, 1.18, -0.18), // Base at superior border/neck
    new THREE.Vector3(-0.06, 1.32, -0.02), // Ascending part
    new THREE.Vector3(0.08, 1.28, 0.18),   // Horizontal hook
    new THREE.Vector3(0.22, 1.22, 0.28)    // Tip of coracoid
  ]);
  const coracoidGeo = new THREE.TubeGeometry(coracoidCurve, 24, 0.052, 12, false);
  const coracoidMesh = new THREE.Mesh(coracoidGeo, scapMat);
  bones.scapula.add(coracoidMesh);

  // 5. Glenoid Cavity & Neck (pear-shaped lateral articular socket)
  const glenoidNeck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.16, 0.16, 20),
    scapMat
  );
  glenoidNeck.position.set(0.06, 1.04, -0.14);
  glenoidNeck.rotation.z = -Math.PI / 2.3;
  bones.scapula.add(glenoidNeck);

  const glenoidRim = new THREE.Mesh(
    new THREE.TorusGeometry(0.14, 0.032, 14, 28),
    scapMat
  );
  glenoidRim.position.set(0.14, 1.05, -0.11);
  glenoidRim.rotation.y = Math.PI / 2.2;
  glenoidRim.scale.set(0.82, 1.25, 1); // Pear-shaped glenoid
  bones.scapula.add(glenoidRim);

  const glenoidSocket = new THREE.Mesh(
    new THREE.SphereGeometry(0.135, 20, 16),
    fossaMat
  );
  glenoidSocket.position.set(0.125, 1.05, -0.11);
  glenoidSocket.scale.set(0.25, 1.22, 0.80);
  bones.scapula.add(glenoidSocket);


  // Anatomically Accurate 3D Humerus
  bones.humerus = new THREE.Group();
  scene.add(bones.humerus);

  const humMat = new THREE.MeshStandardMaterial({
    color: "#e8dac0",
    roughness: 0.54,
    metalness: 0.05
  });
  const articularMat = new THREE.MeshStandardMaterial({
    color: "#f5efe2",
    roughness: 0.32,
    metalness: 0.04
  });

  // 1. Head of Humerus (directed medially, upwards & slightly backwards into Glenoid)
  const humHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 28, 24),
    articularMat
  );
  humHead.position.set(0.28, 1.04, -0.10);
  humHead.scale.set(0.95, 1.05, 0.96);
  bones.humerus.add(humHead);

  // 2. Anatomical Neck & Upper Metaphysis
  const anatNeck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.165, 0.175, 0.14, 24),
    humMat
  );
  anatNeck.position.set(0.36, 0.98, -0.09);
  anatNeck.rotation.z = Math.PI / 4.2;
  bones.humerus.add(anatNeck);

  // 3. Greater Tubercle (Lateral prominence) & Lesser Tubercle (Anterior prominence)
  // Gap between them forms the Intertubercular Sulcus (Bicipital Groove)
  const greaterTubercle = new THREE.Mesh(
    new THREE.SphereGeometry(0.115, 20, 18),
    humMat
  );
  greaterTubercle.position.set(0.47, 1.03, -0.11);
  greaterTubercle.scale.set(0.85, 1.25, 0.95);
  bones.humerus.add(greaterTubercle);

  const lesserTubercle = new THREE.Mesh(
    new THREE.SphereGeometry(0.088, 18, 16),
    humMat
  );
  lesserTubercle.position.set(0.39, 0.99, 0.04);
  lesserTubercle.scale.set(0.90, 1.15, 0.85);
  bones.humerus.add(lesserTubercle);

  // 4. Shaft of Humerus (Cylindrical upper -> Triangular distal) + Surgical Neck
  const humShaftCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.40, 0.92, -0.08),  // Surgical neck
    new THREE.Vector3(0.45, 0.45, -0.07),  // Upper-mid shaft
    new THREE.Vector3(0.51, -0.15, -0.06), // Lower-mid shaft
    new THREE.Vector3(0.56, -0.78, -0.05)  // Supracondylar region
  ]);
  const humShaftGeo = new THREE.TubeGeometry(humShaftCurve, 32, 0.115, 18, false);
  const hPos = humShaftGeo.attributes.position;
  for (let i = 0; i < hPos.count; i++) {
    const vx = hPos.getX(i);
    const vy = hPos.getY(i);
    const vz = hPos.getZ(i);
    const t = Math.max(0, Math.min(1, (0.92 - vy) / 1.70));
    const center = humShaftCurve.getPointAt(t);
    // Surgical neck slight taper (t near 0), mid-shaft taper, distal flare (t > 0.78)
    const neckTaper = t < 0.12 ? 1.12 - t * 1.2 : 1.0;
    const distalFlareX = t > 0.78 ? 1 + ((t - 0.78) / 0.22) * 1.25 : 1.0;
    const distalFlatZ = t > 0.78 ? 1 - ((t - 0.78) / 0.22) * 0.32 : 1.0;

    hPos.setX(i, center.x + (vx - center.x) * neckTaper * distalFlareX);
    hPos.setZ(i, center.z + (vz - center.z) * neckTaper * distalFlatZ);
  }
  humShaftGeo.computeVertexNormals();
  const humShaft = new THREE.Mesh(humShaftGeo, humMat);
  bones.humerus.add(humShaft);

  // 5. Deltoid Tuberosity (V-shaped lateral roughening on mid-shaft)
  const deltoidTub = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 14, 12),
    humMat
  );
  deltoidTub.position.set(0.54, 0.28, -0.06);
  deltoidTub.scale.set(0.65, 2.4, 0.75);
  bones.humerus.add(deltoidTub);

  // 6. Distal End: Medial & Lateral Epicondyles, Trochlea & Capitulum
  const medialEpicondyle = new THREE.Mesh(
    new THREE.SphereGeometry(0.078, 16, 14),
    humMat
  );
  medialEpicondyle.position.set(0.32, -0.84, -0.05);
  medialEpicondyle.scale.set(1.25, 0.90, 0.85);
  bones.humerus.add(medialEpicondyle);

  const lateralEpicondyle = new THREE.Mesh(
    new THREE.SphereGeometry(0.064, 16, 14),
    humMat
  );
  lateralEpicondyle.position.set(0.79, -0.83, -0.05);
  lateralEpicondyle.scale.set(1.10, 0.90, 0.85);
  bones.humerus.add(lateralEpicondyle);

  // Trochlea (Pulley-shaped medial articular surface)
  const trochlea = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.088, 0.17, 20),
    articularMat
  );
  trochlea.position.set(0.47, -0.90, -0.04);
  trochlea.rotation.z = Math.PI / 2.05;
  bones.humerus.add(trochlea);

  // Capitulum (Rounded lateral articular eminence)
  const capitulum = new THREE.Mesh(
    new THREE.SphereGeometry(0.082, 18, 16),
    articularMat
  );
  capitulum.position.set(0.66, -0.89, -0.03);
  capitulum.scale.set(1.05, 0.95, 1.0);
  bones.humerus.add(capitulum);
  
const descriptions = {
 all: "The shoulder region includes the clavicle, scapula and humerus.",
 scapula: "Scapula: A flat triangular bone situated on the posterior aspect of the thoracic wall.",
 humerus: "Humerus: The bone of the arm. Its head articulates with the glenoid cavity of scapula.",
 clavicle: "Clavicle: An S-shaped bone connecting the upper limb to the axial skeleton."
};

  // Visual Thinking Mode: X-Ray Ghost Isolation + 3D Joint Biomechanics
  let currentBone = "all";
  let xrayMode = false;
  let currentMovement = "abduction";

  // Pivot setup for anatomically accurate joint motion
  const ghPivot = new THREE.Group();
  ghPivot.position.set(0.28, 1.04, -0.10); // Glenohumeral joint center
  scene.add(ghPivot);
  bones.humerus.position.set(-0.28, -1.04, 0.10);
  ghPivot.add(bones.humerus);

  const scapPivot = new THREE.Group();
  scapPivot.position.set(-0.75, 1.15, -0.18); // Scapulothoracic upward rotation axis
  scene.add(scapPivot);
  bones.scapula.position.set(0.75, -1.15, 0.18);
  scapPivot.add(bones.scapula);

  const clavPivot = new THREE.Group();
  clavPivot.position.set(-1.42, 1.42, 0.24); // Sternoclavicular pivot
  scene.add(clavPivot);
  bones.clavicle.position.set(1.42, -1.42, -0.24);
  clavPivot.add(bones.clavicle);

  function applyBoneAppearance() {
    Object.keys(bones).forEach(key => {
      const isSelected = currentBone === "all" || key === currentBone;
      bones[key].visible = isSelected || xrayMode;
      bones[key].traverse(child => {
        if (child.isMesh && child.material) {
          if (!child.userData.origMat) {
            child.userData.origMat = child.material.clone();
          }
          if (isSelected) {
            child.material.transparent = false;
            child.material.opacity = 1.0;
            child.material.depthWrite = true;
            child.material.emissive.setHex(currentBone !== "all" ? 0x102838 : 0x000000);
          } else if (xrayMode) {
            child.material.transparent = true;
            child.material.opacity = 0.20;
            child.material.depthWrite = false;
            child.material.emissive.setHex(0x0ea5e9);
          }
        }
      });
    });
  }

  function selectBone(name) {
    currentBone = name;
    applyBoneAppearance();

    ["all", "scapula", "humerus", "clavicle"].forEach(id => {
      document.getElementById(id).classList.remove("active");
    });
    document.getElementById(name).classList.add("active");

    document.getElementById("info").innerHTML =
      "<h3>" + (name === "all" ? "Shoulder Joint" : name.toUpperCase()) +
      "</h3>" + descriptions[name];
  }

  ["all", "scapula", "humerus", "clavicle"].forEach(name => {
    document.getElementById(name).onclick = () => selectBone(name);
  });

  // X-Ray Ghost Toggle
  const xrayBtn = document.getElementById("xray-toggle");
  xrayBtn.onclick = () => {
    xrayMode = !xrayMode;
    xrayBtn.textContent = xrayMode ? "X-Ray Ghost: ON" : "X-Ray Ghost: OFF";
    xrayBtn.classList.toggle("active", xrayMode);
    applyBoneAppearance();
  };

  // Smooth Zoom into Glenohumeral & AC Joint
  document.getElementById("joint-zoom").onclick = () => {
    camera.position.set(1.35, 1.45, 1.85);
    controls.target.set(0.15, 1.15, -0.05);
    controls.update();
  };

  // Joint Movement Simulator
  const slider = document.getElementById("mov-slider");
  const degText = document.getElementById("mov-deg");
  const movLabel = document.getElementById("mov-label");
  const movNote = document.getElementById("mov-note");

  function updateJointMotion() {
    const val = Number(slider.value);
    degText.textContent = val + "°";

    // Reset pivots
    ghPivot.rotation.set(0, 0, 0);
    scapPivot.rotation.set(0, 0, 0);
    clavPivot.rotation.set(0, 0, 0);

    if (currentMovement === "abduction") {
      // Scapulohumeral Rhythm: First 30 deg pure GH, then 2:1 GH to Scapulothoracic ratio
      const scapDeg = val > 30 ? (val - 30) / 3 : 0;
      const ghDeg = val - scapDeg;
      ghPivot.rotation.z = THREE.MathUtils.degToRad(ghDeg);
      scapPivot.rotation.z = THREE.MathUtils.degToRad(scapDeg);
      clavPivot.rotation.z = THREE.MathUtils.degToRad(scapDeg * 0.45);
      movNote.textContent = val <= 30
        ? "0°–30° Setting Phase: Pure Glenohumeral movement."
        : "Scapulohumeral Rhythm (2:1): GH (" + Math.round(ghDeg) + "°) + Scapula upward rotation (" + Math.round(scapDeg) + "°).";
    } else if (currentMovement === "flexion") {
      const scapDeg = val > 45 ? (val - 45) / 3 : 0;
      const ghDeg = val - scapDeg;
      ghPivot.rotation.x = -THREE.MathUtils.degToRad(ghDeg);
      scapPivot.rotation.z = THREE.MathUtils.degToRad(scapDeg * 0.7);
      movNote.textContent = "Anterior elevation of Humerus in sagittal plane (" + val + "°).";
    } else if (currentMovement === "rotation") {
      ghPivot.rotation.y = THREE.MathUtils.degToRad(val);
      movNote.textContent = val < 0
        ? "Internal (Medial) Rotation: Lesser tubercle turns medially."
        : val > 0
          ? "External (Lateral) Rotation: Greater tubercle clears acromion."
          : "Neutral rotational alignment (0°).";
    }
  }

  function setMovementMode(mode) {
    currentMovement = mode;
    ["abduction", "flexion", "rotation"].forEach(m => {
      document.getElementById("mov-" + m).classList.remove("active");
    });
    document.getElementById("mov-" + mode).classList.add("active");

    if (mode === "abduction") {
      movLabel.textContent = "Shoulder Abduction";
      slider.min = 0; slider.max = 180; slider.value = 0;
    } else if (mode === "flexion") {
      movLabel.textContent = "Shoulder Flexion";
      slider.min = 0; slider.max = 160; slider.value = 0;
    } else if (mode === "rotation") {
      movLabel.textContent = "Internal / External Rotation";
      slider.min = -60; slider.max = 70; slider.value = 0;
    }
    updateJointMotion();
  }

  document.getElementById("mov-abduction").onclick = () => setMovementMode("abduction");
  document.getElementById("mov-flexion").onclick = () => setMovementMode("flexion");
  document.getElementById("mov-rotation").onclick = () => setMovementMode("rotation");
  slider.oninput = updateJointMotion;

  document.getElementById("reset").onclick = () => {
    slider.value = 0;
    setMovementMode("abduction");
    xrayMode = false;
    xrayBtn.textContent = "X-Ray Ghost: OFF";
    xrayBtn.classList.remove("active");
    selectBone("all");
    camera.position.set(4, 3, 6);
    controls.target.set(0, 0.3, 0);
    controls.update();
  };
    

selectBone("all");

function animate() {
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=viewer.clientWidth/viewer.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(viewer.clientWidth,viewer.clientHeight);
});
</script>

</body>
</html>
